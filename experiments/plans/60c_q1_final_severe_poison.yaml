# Plan 60c: Final benchmark, severe skew with 20% Gaussian poisoning, 9 aggregators, 5 seeds.
# Used in the paper: Table main (Severe + poisoning), Fig. final and poison-over-time, merge census, Suppl. Table S1 (merge cost). Platform of the reported runs: molab.
# Run: python run_experiments.py --plan experiments/plans/60c_q1_final_severe_poison.yaml --jobs 2

name: q1_final_severe_poison
output_root: results/q1_final_severe_poison
seeds: [42, 7, 44, 13, 99]
experiments:
- name: 3_non_iid_severe_with_poisoning
  base_config:
    simulation: {backend: l2_scaling, protocol: farabi, max_time: 600.0}
    network: {num_nodes: 10, gossip_k: 6}
    dataset: {iid: false, scheme: dirichlet, dirichlet_alpha: 0.1}
    local_training: {max_batches: 20}
    participants:
      total: 10
      distribution: {honest: 0.8, poisoning: 0.2, flipping: 0.0, lazy: 0.0, stealing: 0.0}
    reporting: {interval: 30.0, active_metric_preset: paper_final}
  variations:
  - tag: robust
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: farabi_robust}
  - tag: prox
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: farabi_prox}
  - tag: global_prox
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: farabi_global_prox}
  - tag: multi_krum
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: multi_krum}
  - tag: bulyan
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: bulyan}
  - tag: rfa
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: rfa}
  - tag: balance
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: balance}
  - tag: wfagg
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: wfagg}
  - tag: lightyear
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: lightyear}
