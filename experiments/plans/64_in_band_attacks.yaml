# Plan 64: ALIE (z = 0.25 and 1) and model-space IPM (eps 0.1 and 1), five aggregators, 5 seeds.
# Used in the paper: Table ALIE (structured in-band attacks). Platform of the reported runs: molab.
# Run: python run_experiments.py --plan experiments/plans/64_in_band_attacks.yaml --jobs 2

name: in_band_attacks
output_root: results/in_band_attacks
seeds: [42, 7, 44, 13, 99]
experiments:
- name: alie_baruch
  base_config:
    simulation: {backend: l2_scaling, protocol: farabi, max_time: 600.0}
    network: {num_nodes: 10, gossip_k: 6}
    dataset: {iid: false, scheme: dirichlet, dirichlet_alpha: 0.1}
    local_training: {max_batches: 20}
    participants:
      total: 10
      distribution: {honest: 0.8, poisoning: 0.2, flipping: 0.0, lazy: 0.0, stealing: 0.0}
      attacks:
        poisoning: {mode: alie, evaluate_true_accuracy: true}
    reporting: {interval: 30.0, active_metric_preset: paper_final}
  variations:
  - tag: global_prox
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: farabi_global_prox}
  - tag: balance
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: balance}
  - tag: lightyear
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: lightyear}
  - tag: rfa
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: rfa}
  - tag: robust
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: farabi_robust}
