# Plan 58c: CIFAR-10 at alpha 0.5 without attackers (FARABI, distance gates, centralized FedAvg) and a centralized reference at alpha 0.1, 5 seeds.
# Used in the paper: Sec. CIFAR-10 (moderate skew, centralized references). Platform of the reported runs: molab.
# Run: python run_experiments.py --plan experiments/plans/58c_cifar_references.yaml --jobs 2

name: cifar_references
output_root: results/cifar_references
seeds: [42, 7, 44, 13, 99]
experiments:
- name: S2_cifar_moderate_honest
  base_config:
    simulation: {backend: l2_scaling, protocol: farabi, max_time: 600.0}
    network: {num_nodes: 10, gossip_k: 6}
    dataset: {name: cifar10, download: true, iid: false, scheme: dirichlet, dirichlet_alpha: 0.5}
    model: {name: cnn_cifar10_gn, num_classes: 10}
    local_training: {epochs: 2, optimizer: sgd, momentum: 0.9, lr: 0.01, clip_grad_norm: 2.0, max_batches: 160}
    participants:
      total: 10
      distribution: {honest: 1.0, poisoning: 0.0, flipping: 0.0, lazy: 0.0, stealing: 0.0}
    reporting: {interval: 30.0, active_metric_preset: paper_final}
  variations:
  - tag: global_prox
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: farabi_global_prox}
  - tag: robust
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: farabi_robust}
  - tag: centralized_fedavg
    overrides:
      simulation: {backend: centralized, protocol: generic_protocol, centralized_round_interval: 10.0}
      aggregation: {strategy: fedavg}
- name: S3_cifar_severe_honest
  base_config:
    simulation: {backend: l2_scaling, protocol: farabi, max_time: 600.0}
    network: {num_nodes: 10, gossip_k: 6}
    dataset: {name: cifar10, download: true, iid: false, scheme: dirichlet, dirichlet_alpha: 0.1}
    model: {name: cnn_cifar10_gn, num_classes: 10}
    local_training: {epochs: 2, optimizer: sgd, momentum: 0.9, lr: 0.01, clip_grad_norm: 2.0, max_batches: 160}
    participants:
      total: 10
      distribution: {honest: 1.0, poisoning: 0.0, flipping: 0.0, lazy: 0.0, stealing: 0.0}
    reporting: {interval: 30.0, active_metric_preset: paper_final}
  variations:
  - tag: centralized_fedavg
    overrides:
      simulation: {backend: centralized, protocol: generic_protocol, centralized_round_interval: 10.0}
      aggregation: {strategy: fedavg}
