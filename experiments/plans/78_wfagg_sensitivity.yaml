# Plan 78: WFAgg with varied attacker count, mixing weight and filter rule, severe skew with and without 20% poisoning, 5 seeds.
# Used in the paper: Discussion (calibration of the baselines), Suppl. Table S8. Platform of the reported runs: molab.
# Run: python run_experiments.py --plan experiments/plans/78_wfagg_sensitivity.yaml --jobs 2

name: wfagg_sensitivity
output_root: results/wfagg_sensitivity
seeds: [42, 7, 44, 13, 99]
experiments:
- name: severe_with_poisoning
  base_config:
    simulation: {backend: l2_scaling, protocol: farabi, max_time: 600.0}
    network: {num_nodes: 10, gossip_k: 6}
    dataset: {iid: false, scheme: dirichlet, dirichlet_alpha: 0.1}
    local_training: {max_batches: 20}
    participants:
      total: 10
      distribution: {honest: 0.8, poisoning: 0.2, flipping: 0.0, lazy: 0.0, stealing: 0.0}
    reporting: {interval: 30.0, active_metric_preset: paper_final}
  variations:
  - tag: global_prox
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: farabi_global_prox}
  - tag: wfagg
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: wfagg}
  - tag: wfagg_f1
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: wfagg, assumed_byzantine_f: 1}
  - tag: wfagg_f0
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: wfagg, assumed_byzantine_f: 0}
  - tag: wfagg_a0p5
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: wfagg, wfagg_alpha: 0.5}
  - tag: wfagg_minf1
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: wfagg, wfagg_min_filters: 1}
- name: severe_honest
  base_config:
    simulation: {backend: l2_scaling, protocol: farabi, max_time: 600.0}
    network: {num_nodes: 10, gossip_k: 6}
    dataset: {iid: false, scheme: dirichlet, dirichlet_alpha: 0.1}
    local_training: {max_batches: 20}
    participants:
      total: 10
      distribution: {honest: 1.0, poisoning: 0.0, flipping: 0.0, lazy: 0.0, stealing: 0.0}
    reporting: {interval: 30.0, active_metric_preset: paper_final}
  variations:
  - tag: wfagg
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: wfagg}
  - tag: wfagg_a0p5
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: wfagg, wfagg_alpha: 0.5}
  - tag: wfagg_minf1
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: wfagg, wfagg_min_filters: 1}
