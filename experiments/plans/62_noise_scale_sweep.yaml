# Plan 62: Gaussian poisoning with sigma 10, 0.1, 0.01 and 0.003 per parameter, five aggregators, 5 seeds.
# Used in the paper: Sec. attacks closer to the honest band (noise sweep). Platform of the reported runs: molab.
# Run: python run_experiments.py --plan experiments/plans/62_noise_scale_sweep.yaml --jobs 2

name: noise_scale_sweep
output_root: results/noise_scale_sweep
seeds: [42, 7, 44, 13, 99]
experiments:
- name: sigma_10p0
  base_config:
    simulation: {backend: l2_scaling, protocol: farabi, max_time: 600.0}
    network: {num_nodes: 10, gossip_k: 6}
    dataset: {iid: false, scheme: dirichlet, dirichlet_alpha: 0.1}
    local_training: {max_batches: 20}
    participants:
      total: 10
      distribution: {honest: 0.8, poisoning: 0.2, flipping: 0.0, lazy: 0.0, stealing: 0.0}
      attacks:
        poisoning: {noise_std: 10.0, evaluate_true_accuracy: true}
    reporting: {interval: 30.0, active_metric_preset: paper_final}
  variations:
  - tag: global_prox
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: farabi_global_prox}
  - tag: balance
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: balance}
  - tag: lightyear
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: lightyear}
  - tag: rfa
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: rfa}
  - tag: robust
    overrides:
      protocols:
        farabi:
          aggregation: {strategy: farabi_robust}
